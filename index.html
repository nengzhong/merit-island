<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功德主提報系統 - 互動式導覽島</title>
    <style>
        :root {
            --primary: #8c2b2b;
            --primary-light: #fdf8f5;
            --ocean: #6495ed;
            --sand: #e6d7b8;
            --grass: #55a630;
            --dark: #2b2d42;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            color: var(--dark);
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 8px; letter-spacing: 1px; }
        p.subtitle { color: #555; font-size: 1.05rem; }

        /* 探索島嶼區域 */
        .island-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 2px solid rgba(255,255,255,0.8);
        }

        .island-container {
            position: relative;
            width: 920px;
            height: 620px;
            background: radial-gradient(circle, #78a6db 0%, #4a80ce 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        /* 2D 擬真島嶼形狀 */
        .sand-bank {
            position: absolute;
            top: 40px; left: 60px; width: 800px; height: 540px;
            background: #e9d8a6;
            border-radius: 43% 57% 51% 49% / 47% 43% 57% 53%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .grass-land {
            position: absolute;
            top: 30px; left: 35px; width: 730px; height: 480px;
            background: linear-gradient(145deg, #70e000 0%, #38b000 100%);
            border-radius: 40% 60% 53% 47% / 44% 46% 54% 56%;
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.3);
        }

        /* 地標微動畫標籤 */
        .hotspot {
            position: absolute;
            background: white;
            padding: 10px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 14px;
            color: var(--primary);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-light);
            animation: float 3s ease-in-out infinite;
        }

        .hotspot:hover {
            transform: scale(1.15) translateY(-5px);
            background: var(--primary);
            color: white;
            z-index: 10;
        }

        .hotspot .badge {
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }
        .hotspot:hover .badge { background: white; color: var(--primary); }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        /* 站點位置座標 */
        #spot1 { top: 430px; left: 80px; animation-delay: 0s; }
        #spot2 { top: 290px; left: 180px; animation-delay: 0.5s; }
        #spot3 { top: 130px; left: 330px; animation-delay: 1s; }
        #spot4 { top: 240px; left: 490px; animation-delay: 1.5s; }
        #spot5 { top: 410px; left: 590px; animation-delay: 2s; }
        #spot6 { top: 170px; left: 660px; background: #2a9d8f; color: white; animation-delay: 2.5s; }
        #spot6 .badge { background: white; color: #2a9d8f; }

        /* 滿版彈窗 Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            width: 620px;
            max-width: 92%;
            max-height: 85vh;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            position: relative;
            overflow-y: auto;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-card h2 { color: var(--primary); font-size: 1.6rem; margin-bottom: 6px; }
        .modal-card .tag { display: inline-block; background: #fce8e8; color: var(--primary); padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; margin-bottom: 18px; }
        .modal-card h4 { color: #555; margin: 12px 0 6px 0; font-size: 1.05rem; }
        .modal-card ul { padding-left: 20px; line-height: 1.7; color: #333; margin-bottom: 12px; }
        .modal-card li { margin-bottom: 8px; }
        
        .highlight-box {
            background: #f8f9fa;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .close-btn {
            position: absolute; top: 20px; right: 20px;
            width: 36px; height: 36px; border-radius: 50%;
            background: #f1f3f5; border: none; font-size: 20px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            color: #666; transition: 0.2s;
        }
        .close-btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🏝️ 功德主提報系統 - 全景導覽島</h1>
        <p class="subtitle">點擊島上關鍵站點，探索系統權限、宏瞻整併與提報實務細節</p>
    </header>

    <div class="island-card">
        <div class="island-container">
            <div class="sand-bank">
                <div class="grass-land">
                    <div class="hotspot" id="spot1" onclick="openModal(1)">
                        <div class="badge">1</div> ⚓ 講習港口（權限）
                    </div>
                    <div class="hotspot" id="spot2" onclick="openModal(2)">
                        <div class="badge">2</div> 💳 佛光卡服務台
                    </div>
                    <div class="hotspot" id="spot3" onclick="openModal(3)">
                        <div class="badge">3</div> 🏦 宏瞻金庫（整併）
                    </div>
                    <div class="hotspot" id="spot4" onclick="openModal(4)">
                        <div class="badge">4</div> 🏛️ 提報大殿（新品/增品）
                    </div>
                    <div class="hotspot" id="spot5" onclick="openModal(5)">
                        <div class="badge">5</div> 📜 功德長廊（細節採計）
                    </div>
                    <div class="hotspot" id="spot6" onclick="openModal(6)">
                        <div class="badge">6</div> ✍️ 主管關卡（送件）
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 滿版內容彈窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">標題</h2>
            <div class="tag" id="modalTag">分類說明</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const cardData = {
            1: {
                title: "第一站：講習港口",
                tag: "系統開放與權限規定",
                html: `
                    <h4>📌 系統權限開放原則</h4>
                    <ul>
                        <li><b>講習會規定：</b> 申請提報系統需參與「功德主提報講習會」，教學完畢後方可開放權限[cite: 1]。</li>
                        <li><b>歷史簽到放行：</b> 若曾參與過 <b>2019 年（含）以後</b> 之提報講習，經查核簽到紀錄屬實者，亦可直接開放權限[cite: 1]。</li>
                    </ul>
                    <div class="highlight-box">
                        💡 <b>權限提示：</b> 財務權限（如全區捐款累積）不會任意開放給所有人員，財務資料將由各道場財務人員協助匯出提供[cite: 3]。
                    </div>
                `
            },
            2: {
                title: "第二站：佛光卡服務台",
                subtitle: "身分與卡號串聯作業",
                tag: "佛光卡與信徒資料庫",
                html: `
                    <h4>📌 辦卡與資料整合核心觀念</h4>
                    <ul>
                        <li><b>必要前提：</b> 提報功德主<b>必須</b>辦理佛光卡（牽涉後續提報與入帳串聯）[cite: 2, 3]。</li>
                        <li><b>勾選身分：</b> 申辦佛光卡時，務必勾選「功德主」身分別，無論主歸屬是否為本道場[cite: 2]。</li>
                        <li><b>綁定宏瞻編號：</b> 申辦當下請先確認並點選符合該功德主平時入帳功德項目的宏瞻代號，並記錄下來[cite: 2]。</li>
                        <li><b>嚴禁重複新增：</b> 系統信徒資料無法輕易刪除，若發現同人多筆資料，務必優先選擇已有「宏瞻捐款」或「佛光卡」的名單，切勿再開新名單導致功德分散[cite: 2, 4]。</li>
                    </ul>
                `
            },
            3: {
                title: "第三站：宏瞻金庫",
                tag: "財務數據清理與代號變更",
                html: `
                    <h4>📌 提報前資料整理步驟</h4>
                    <ul>
                        <li><b>匯出名冊：</b> 進入「全部捐款人捐款累計」，點選檔案匯出時<b>務必選擇「交付後端」</b>，利用後台離峰時間處理，防止系統當機[cite: 2]。</li>
                        <li><b>代號變更（重中之重）：</b> 若同一人有多個宏瞻號碼，須在 <b>12/31 前</b> 進入「變更捐款人」功能，將錯誤代號統一修正為佛光卡綁定之唯一號碼，並於備註欄留下修改脈絡[cite: 2, 4]。</li>
                        <li><b>金額採計欄位：</b> 評估是否達提報標準，請採計<b>【道場建檔金額】＋【代收捐款金額】</b>，勸募轉入款由代收單位提報[cite: 2, 4]。</li>
                    </ul>
                `
            },
            4: {
                title: "第四站：提報大殿",
                tag: "新品提報、增品提報與夫妻串聯",
                html: `
                    <h4>📌 提報類型與門檻說明</h4>
                    <ul>
                        <li><b>新品提報：</b> 首次提報為功德主者（必須先辦妥佛光卡才帶得到資料）[cite: 2, 3]。</li>
                        <li><b>增品提報：</b> 過去已是功德主，年度整理宏瞻累計額度後進行品位晉升[cite: 2]。</li>
                        <li><b>各地門檻參考：</b>
                            <ul>
                                <li><b>歐洲地區：</b> 新品滿 3,000 歐元；增品滿 6,000 歐元（或當年度達 1,000 歐元可彈性處理）[cite: 2]。</li>
                                <li><b>台灣/其他：</b> 新品約 10~20 萬台幣；增品約 20 萬台幣[cite: 3]。</li>
                            </ul>
                        </li>
                    </ul>
                    <div class="highlight-box">
                        👨‍👩‍👧 <b>夫妻新品串聯標準 SOP：</b><br>
                        雙方皆須辦理佛光卡 $\rightarrow$ 提報 A 戶 $\rightarrow$ 進入 A 的資料修改底下的配偶欄串聯 B $\rightarrow$ 重新搜尋出現 AB 戶 $\rightarrow$ 點選 B 進行提報。（先串後提，才不會生成兩張功德證號！）[cite: 2]
                    </div>
                `
            },
            5: {
                title: "第五站：功德長廊",
                tag: "義工時數、物資與特殊貢獻",
                html: `
                    <h4>📌 特別項目採計細節</h4>
                    <ul>
                        <li><b>義工時數提報：</b>
                            <ul>
                                <li>門檻：苦行/文教類達 <b>500 小時</b>，服務類達 <b>1,000 小時</b>[cite: 3]。</li>
                                <li>事蹟備註格式：必須寫出精算公式，如：<br><code>掌廚 3小時 × 週2次 × 40週 = 240小時</code>[cite: 2]。</li>
                            </ul>
                        </li>
                        <li><b>物資捐贈：</b> 供花供果不列入提報[cite: 2, 3]；僅限大筆資產（車輛、電腦等）[cite: 2, 3]。若是信徒自家生產產業物品，金額<b>統一除以三（成本價）</b>計算[cite: 2]。</li>
                        <li><b>特殊貢獻：</b> 指協助常住解決非常住能力所及之人事務（如協商購得道場涉入之國有土地）[cite: 2, 3]。</li>
                    </ul>
                `
            },
            6: {
                title: "第六站：主管關卡",
                tag: "審核與最終送件作業",
                html: `
                    <h4>📌 主管送件最後一步</h4>
                    <ul>
                        <li><b>送件權限：</b> 僅道場<b>主管/負責人</b>有權限進行最終送件[cite: 3, 5]。</li>
                        <li><b>操作兩步驟：</b> 點選 <b>1. 全選</b> $\rightarrow$ 點選 <b>2. 提報送件</b>[cite: 5]。</li>
                    </ul>
                    <div class="highlight-box" style="border-left-color: #e63946; background: #fff5f5;">
                        ⚠️ <b>關鍵警告：</b> 提報資料若未全選送件，這些資料會滯留在系統暫存區（俗稱「中陰生」），將無法進入後續委員會評鑑與紀錄[cite: 2]！
                    </div>
                `
            }
        };

        function openModal(id) {
            const data = cardData[id];
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalTag').innerText = data.tag;
            document.getElementById('modalBody').innerHTML = data.html;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
